[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ikea-dirigera-client"
version = "0.1.0"
description = "Python client for an IKEA DIRIGERA smart home hub"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dirigera>=1.2.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
